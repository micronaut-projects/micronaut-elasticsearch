pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id("io.micronaut.build.shared.settings") version "8.0.0-M13"
}

rootProject.name = 'elasticsearch-parent'

include 'elasticsearch-bom'
include 'elasticsearch'
include 'test-suite-groovy'
include 'test-suite-java'
include 'test-suite-utils'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-security")
    importMicronautCatalog("micronaut-validation")
}
